name: install-sdk

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools libclang-rt-23-dev libpolly-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure and build SDK
        run: >-
          cmake -S . -B build/install-sdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
      - run: cmake --build build/install-sdk --parallel 2
      - name: Install, relocate, check, build, and run SDK fixtures
        run: ctest --test-dir build/install-sdk -R '^install_sdk_relocation$' --output-on-failure
      - name: Verify installed SDK with build tree removed
        run: python tests/tooling/install_sdk_without_build_tree_test.py cmake build/install-sdk . Release
