name: windows-release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM 23.1.4
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-23.1.4.tar.xz'
          $uri = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/clang%2Bllvm-23.1.4-x86_64-pc-windows-msvc.tar.xz'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          tar -xf $archive -C $env:RUNNER_TEMP
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'clang+llvm-23.1.4-x86_64-pc-windows-msvc'
          $llvmBin = Join-Path $llvmRoot 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_ROOT=$llvmRoot"
          python -m pip install --upgrade "cmake>=4.2" ninja
      - name: Configure clang-cl Release build
        shell: pwsh
        run: |
          cmake --preset windows-clang-cl-release
      - name: Build
        run: cmake --build --preset windows-clang-cl-release --parallel 2
      - name: Architecture and language checks
        run: |
          python tools/architecture_check/check.py --root .
          python tools/spec_check/check.py --root .
      - name: Run CTest release gates
        run: ctest --preset windows-clang-cl-release
      - name: Build and run Hello World
        shell: pwsh
        run: |
          build/windows/clang-cl/release/ombasic.exe check examples/hello/main.bas
          $hello = Join-Path $env:RUNNER_TEMP 'hello.exe'
          build/windows/clang-cl/release/ombasic.exe build examples/hello/main.bas -o $hello
          & $hello
      - name: Verify installed SDK with build tree removed
        run: python tests/tooling/install_sdk_without_build_tree_test.py cmake build/windows/clang-cl/release . Release
      - name: Stage the SDK with build provenance
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'build/package/windows'
          cmake --install build/windows/clang-cl/release --prefix $package
          python tools/release/write_provenance.py `
            --root . `
            --output (Join-Path $package 'share/ombasic/release-provenance.json') `
            --target x86_64-pc-windows-msvc `
            --llvm-version 23.1.4 `
            --clang "$env:LLVM_ROOT/bin/clang-cl.exe" `
            --lld "$env:LLVM_ROOT/bin/lld-link.exe"
          Compress-Archive -Path (Join-Path $package '*') `
            -DestinationPath build/ombasic-windows-sdk.zip -Force
      - name: Upload the Windows SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ombasic-windows-sdk
          path: build/ombasic-windows-sdk.zip
          if-no-files-found: error
