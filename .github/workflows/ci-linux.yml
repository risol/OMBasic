name: linux-release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools libclang-rt-23-dev libpolly-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure Release build
        run: >-
          cmake -S . -B build/linux-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
      - name: Build
        run: cmake --build build/linux-release --parallel 2
      - name: Architecture and language checks
        run: |
          python tools/architecture_check/check.py --root .
          python tools/spec_check/check.py --root .
      - name: Run CTest release gates
        run: ctest --test-dir build/linux-release --output-on-failure
      - name: Build and run Hello World
        run: |
          build/linux-release/ombasic check examples/hello/main.bas
          build/linux-release/ombasic build examples/hello/main.bas -o "$RUNNER_TEMP/hello"
          "$RUNNER_TEMP/hello"
      - name: Stage the SDK with build provenance
        run: |
          cmake --install build/linux-release --prefix build/package/linux
          python tools/release/write_provenance.py \
            --root . \
            --output build/package/linux/share/ombasic/release-provenance.json \
            --target x86_64-unknown-linux-gnu \
            --llvm-version "$(llvm-config-23 --version)" \
            --clang clang-23 \
            --lld ld.lld-23
          tar -czf build/ombasic-linux-sdk.tar.gz -C build/package/linux .
      - name: Upload the Linux SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ombasic-linux-sdk
          path: build/ombasic-linux-sdk.tar.gz
          if-no-files-found: error
