name: fuzz

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23, libFuzzer, and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools \
            libclang-rt-23-dev libpolly-23-dev libfuzzer-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure ASan/UBSan fuzzers
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
          -DOM_SANITIZER=address-undefined
          -DOM_BUILD_FUZZERS=ON
      - name: Build fuzzer targets
        run: cmake --build build/fuzz --parallel 2
      - name: Run short fuzzer smoke set
        run: |
          set -euo pipefail
          for fuzzer in \
            ombasic_fuzz_syntax \
            ombasic_fuzz_metadata \
            ombasic_fuzz_import_path \
            ombasic_fuzz_distribution \
            ombasic_fuzz_hir_verifier \
            ombasic_fuzz_mir_verifier \
            ombasic_fuzz_distribution_serializer \
            ombasic_fuzz_native_descriptor_codec; do
            "build/fuzz/${fuzzer}" -runs=200 -max_len=4096
          done
          build/fuzz/ombasic_fuzz_llvm_backend -runs=20 -max_len=4096

  fuzz-extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23, libFuzzer, and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools \
            libclang-rt-23-dev libpolly-23-dev libfuzzer-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure ASan/UBSan fuzzers
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
          -DOM_SANITIZER=address-undefined
          -DOM_BUILD_FUZZERS=ON
      - name: Build fuzzer targets
        run: cmake --build build/fuzz --parallel 2
      - name: Run extended fuzzer budget
        run: |
          set -euo pipefail
          for fuzzer in \
            ombasic_fuzz_syntax \
            ombasic_fuzz_metadata \
            ombasic_fuzz_import_path \
            ombasic_fuzz_distribution \
            ombasic_fuzz_hir_verifier \
            ombasic_fuzz_mir_verifier \
            ombasic_fuzz_distribution_serializer \
            ombasic_fuzz_native_descriptor_codec; do
            "build/fuzz/${fuzzer}" -max_total_time=60 -max_len=4096
          done
          build/fuzz/ombasic_fuzz_llvm_backend -max_total_time=60 -max_len=4096
