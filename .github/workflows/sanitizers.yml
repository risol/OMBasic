name: sanitizers

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools libclang-rt-23-dev libpolly-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/asan-ubsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
          -DOM_SANITIZER=address-undefined
      - name: Build
        run: cmake --build build/asan-ubsan --parallel 2
      - name: Run ASan and UBSan CTest gates
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/asan-ubsan --output-on-failure

  tsan:
    name: tsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM 23 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ninja-build
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev llvm-23-tools libclang-rt-23-dev libpolly-23-dev
          python -m pip install --upgrade "cmake>=4.2"
      - name: Configure TSan
        run: >-
          cmake -S . -B build/tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DOM_LLVM_TARGET_TRIPLE=x86_64-unknown-linux-gnu
          -DOM_SANITIZER=thread
      - name: Build
        run: cmake --build build/tsan --parallel 2
      - name: Run TSan CTest gates
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build/tsan --output-on-failure
